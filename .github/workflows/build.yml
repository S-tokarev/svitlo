name: Сборка

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Платформа Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Тесты и debug APK
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iPhone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка для симулятора
        run: |
          xcodebuild \
            -project ios/Svitlo.xcodeproj \
            -scheme Svitlo \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-ios-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/Svitlo.app
          if-no-files-found: error
