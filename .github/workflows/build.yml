name: Сборка

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 35
        run: |
          root="${ANDROID_HOME:-$HOME/android-sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            if [ ! -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$root/cmdline-tools"
              curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
              unzip -q /tmp/cmdtools.zip -d "$root/cmdline-tools"
              mv "$root/cmdline-tools/cmdline-tools" "$root/cmdline-tools/latest"
            fi
            echo "$root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            export PATH="$root/cmdline-tools/latest/bin:$PATH"
          fi
          echo "ANDROID_HOME=$root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
          export ANDROID_HOME="$root"
          export ANDROID_SDK_ROOT="$root"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Тесты и debug APK
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iPhone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка для симулятора
        run: |
          xcodebuild \
            -project ios/Svitlo.xcodeproj \
            -scheme Svitlo \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-ios-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/Svitlo.app
          if-no-files-found: error
