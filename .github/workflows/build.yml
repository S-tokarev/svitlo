name: Сборка

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 35
        run: |
          root="${ANDROID_HOME:-$HOME/android-sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            if [ ! -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$root/cmdline-tools"
              curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
              unzip -q /tmp/cmdtools.zip -d "$root/cmdline-tools"
              mv "$root/cmdline-tools/cmdline-tools" "$root/cmdline-tools/latest"
            fi
            echo "$root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            export PATH="$root/cmdline-tools/latest/bin:$PATH"
          fi
          echo "ANDROID_HOME=$root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
          export ANDROID_HOME="$root"
          export ANDROID_SDK_ROOT="$root"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Тесты и APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk svitlo-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-android-debug
          path: svitlo-android.apk
          if-no-files-found: error

  desktop-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Собрать приложение
        run: |
          ./gradlew.bat :desktop:createDistributable --stacktrace
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-ChildItem desktop\build\compose\logs -Recurse -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Output "==== $($_.Name) ===="
              Get-Content $_.FullName
            }
          }
          exit $code
      - name: Архив
        run: Compress-Archive -Path desktop\build\compose\binaries\main\app\Svitlo -DestinationPath svitlo-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-windows
          path: svitlo-windows.zip
          if-no-files-found: error

  desktop-mac-intel:
    name: Mac Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Собрать приложение
        run: |
          chmod +x ./gradlew
          ./gradlew :desktop:createDistributable --stacktrace
      - name: Архив
        run: ditto -c -k --keepParent desktop/build/compose/binaries/main/app/Svitlo.app svitlo-mac-intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-mac-intel
          path: svitlo-mac-intel.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [android, desktop-windows, desktop-mac-intel]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.android.result == 'success' &&
      needs.desktop-windows.result == 'success' &&
      needs.desktop-mac-intel.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Опубликовать Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find dist -name 'svitlo-android.apk' -print -quit)"
          windows="$(find dist -name 'svitlo-windows.zip' -print -quit)"
          mac="$(find dist -name 'svitlo-mac-intel.zip' -print -quit)"
          test -n "$apk" && test -n "$windows" && test -n "$mac"
          cp "$apk" svitlo-android.apk
          cp "$windows" svitlo-windows.zip
          cp "$mac" svitlo-mac-intel.zip
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Последняя сборка" \
            --prerelease \
            --notes "$(printf '%s\n' \
              "Сборка коммита ${GITHUB_SHA}." \
              "" \
              "svitlo-android.apk — сборка для телефона. Если старое Светло не обновляется, удалите его и установите этот файл: раньше каждая сборка GitHub была с новой подписью." \
              "svitlo-windows.zip — Windows. Закройте окно: программа останется в трее и пришлёт уведомления." \
              "svitlo-mac-intel.zip — Mac с процессором Intel. Распакуйте архив и откройте Svitlo.app. На Mac с процессором Apple (M1 и новее) этот файл не запустится.")" \
            svitlo-android.apk svitlo-windows.zip svitlo-mac-intel.zip
